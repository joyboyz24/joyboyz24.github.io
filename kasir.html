<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b1d3a">
<title id="k-doc-title">JOY POS — Kasir</title>
<style>
:root{
  --bg:#061021;
  --navy:#0b1d3a;
  --surface:#102547;
  --surface-2:#173461;
  --border:rgba(255,255,255,.09);
  --text:#f1f5f9;
  --muted:#8fa3c4;
  --gold:#d4af37;
  --gold-soft:rgba(212,175,55,.15);
  --accent:#10b981;
  --accent-soft:rgba(16,185,129,.15);
  --danger:#ef4444;
  --warn:#f59e0b;
  --info:#38bdf8;
  --font:'Inter','Segoe UI',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font);
  background:radial-gradient(circle at top left,#153363 0%,var(--bg) 58%);
  color:var(--text);
  min-height:100vh;
  font-variant-numeric:tabular-nums;
}

/* Login Kasir */
#cashier-login{
  position:fixed;inset:0;
  background:radial-gradient(circle at 80% 18%,#163569 0%,#050d1c 75%);
  display:flex;align-items:center;justify-content:center;
  z-index:999;padding:20px;
}
.login-card{
  background:rgba(16,37,71,.94);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:24px;
  padding:32px 28px;width:100%;max-width:410px;text-align:center;
  box-shadow:0 28px 70px rgba(0,0,0,.52);
}
.brand-badge{
  display:inline-block;font-size:.68rem;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--gold);background:var(--gold-soft);padding:5px 12px;border-radius:99px;
  font-weight:700;margin-bottom:10px;
}
.login-card h1{font-size:1.45rem;font-weight:700;margin-bottom:20px}

/* Shell Kasir */
.pos-shell{display:none;min-height:100vh;flex-direction:column}
.pos-shell.active{display:flex}

.topbar{
  background:rgba(11,29,58,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  position:sticky;top:0;z-index:70;
}
.brand-box{display:flex;align-items:center;gap:10px}
.brand-box img{width:36px;height:36px;object-fit:contain;border-radius:10px;background:var(--surface-2);padding:4px;display:none}
.sub-meta{font-size:.73rem;color:var(--muted)}

.pos-grid{
  max-width:1440px;width:100%;margin:0 auto;padding:18px;
  display:grid;grid-template-columns:1fr 410px;gap:18px;align-items:start;
}

.panel{
  background:rgba(16,37,71,.84);border:1px solid var(--border);
  border-radius:20px;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.22);
}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.panel-head h3{font-size:.98rem;font-weight:700}

.form-group{margin-bottom:11px;text-align:left}
.form-group label{display:block;font-size:.73rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.form-control{
  width:100%;padding:10px 12px;background:rgba(6,16,33,.78);
  border:1px solid var(--border);border-radius:11px;color:var(--text);
  font-size:.86rem;outline:none;transition:border-color .15s,box-shadow .15s;
}
.form-control:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.14)}

/* Produk Grid */
.prod-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;
}
.prod-card{
  background:linear-gradient(165deg,rgba(23,52,97,.52),rgba(11,29,58,.92));
  border:1px solid var(--border);border-radius:16px;padding:12px;
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  cursor:pointer;transition:.16s;
}
.prod-card:hover:not(.disabled){
  border-color:rgba(212,175,55,.45);transform:translateY(-2px);
  box-shadow:0 12px 24px rgba(0,0,0,.28);
}
.prod-card.disabled{opacity:.45;cursor:not-allowed}
.prod-img{
  width:100%;height:106px;object-fit:cover;border-radius:11px;
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:.75rem;font-weight:600;
}
.prod-sku{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.prod-name{font-size:.88rem;font-weight:700;line-height:1.3}
.prod-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:2px}
.prod-price{font-size:.88rem;font-weight:700;color:var(--gold)}
.prod-stock{font-size:.7rem;color:var(--accent);font-weight:600}
.prod-stock.low{color:var(--warn)}
.prod-stock.out{color:var(--danger)}

/* Keranjang */
.cart-items{max-height:270px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.cart-item{
  background:rgba(6,16,33,.62);border:1px solid var(--border);
  border-radius:13px;padding:10px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.qty-box{display:flex;align-items:center;gap:6px}
.qty-btn{
  width:26px;height:26px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-weight:700;cursor:pointer;
}
.sum-box{
  background:rgba(6,16,33,.68);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;margin-bottom:14px;
}
.sum-row{display:flex;justify-content:space-between;font-size:.82rem;margin:4px 0;color:var(--muted)}
.sum-row.total{
  border-top:1px dashed rgba(255,255,255,.16);padding-top:8px;margin-top:8px;
  font-size:1rem;font-weight:700;color:var(--text);
}
.sum-row.total span:last-child{color:var(--gold)}

.quick-cash{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.qris-box{
  background:rgba(6,16,33,.65);border:1px dashed rgba(212,175,55,.4);
  border-radius:13px;padding:10px;text-align:center;margin-bottom:12px;display:none;
}
.qris-box img{max-width:170px;max-height:170px;border-radius:10px;margin:6px auto;display:block}

/* Riwayat Singkat */
.history-panel{max-width:1440px;width:100%;margin:0 auto 24px;padding:0 18px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:10px 11px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px}

.badge{padding:4px 10px;border-radius:99px;font-size:.72rem;font-weight:600;display:inline-block}
.badge-ok{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(16,185,129,.25)}
.badge-ref{background:rgba(239,68,68,.15);color:var(--danger)}
.badge-gold{background:var(--gold-soft);color:var(--gold)}
.badge-info{background:rgba(56,189,248,.14);color:var(--info);border:1px solid rgba(56,189,248,.25)}

/* Buttons & Modal */
.btn{
  padding:9px 14px;border-radius:11px;border:none;font-weight:600;
  font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:.15s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn-gold{background:linear-gradient(135deg,#e2c044,#c59b27);color:#09152b}
.btn-info{background:var(--info);color:#061224}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn-sm{padding:6px 10px;font-size:.74rem;border-radius:9px}

.modal-bg{position:fixed;inset:0;background:rgba(3,9,20,.84);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-bg.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}

/* Struk Thermal 58mm & 80mm */
.receipt-sheet{
  background:#fff;color:#0f172a;border-radius:10px;padding:12px;
  font-family:'Courier New',monospace;font-size:12px;line-height:1.4;
  width:100%;max-width:80mm;margin:0 auto;
}
.receipt-sheet.paper-58{
  max-width:58mm;padding:8px;font-size:10.5px;line-height:1.35;
}
.rs-c{text-align:center}
.rs-l{border-top:1px dashed #64748b;margin:7px 0}
.rs-r{display:flex;justify-content:space-between;gap:6px;margin:2px 0}

#toast-box{position:fixed;top:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);padding:11px 15px;border-radius:12px;font-size:.83rem;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.toast.err{border-left-color:var(--danger)}

@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:fixed;left:0;top:0;width:100%}
  .receipt-sheet{border-radius:0;margin:0;max-width:100% !important}
}
@media(max-width:980px){
  .pos-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN KASIR -->
<div id="cashier-login">
  <div class="login-card">
    <span class="brand-badge">Cashier Terminal</span>
    <h1 id="k-login-title">JOY POS</h1>

    <div class="form-group">
      <label>Pilih Outlet</label>
      <select id="k-login-outlet" class="form-control" onchange="renderCashierSelect()"></select>
    </div>
    <div class="form-group">
      <label>Pilih Kasir</label>
      <select id="k-login-emp" class="form-control"></select>
    </div>
    <div class="form-group">
      <label>PIN Kasir</label>
      <input type="password" id="k-login-pin" class="form-control" placeholder="••••" maxlength="6" inputmode="numeric" onkeydown="if(event.key==='Enter')loginCashier()">
    </div>
    <button class="btn btn-gold" style="width:100%;padding:12px" onclick="loginCashier()">Buka Kasir</button>
  </div>
</div>

<!-- APLIKASI KASIR -->
<div class="pos-shell" id="cashier-app">
  <header class="topbar">
    <div class="brand-box">
      <img id="k-top-logo" alt="Logo">
      <div>
        <div style="font-weight:700;font-size:.96rem" id="k-top-app">JOY POS</div>
        <div class="sub-meta" id="k-session-info">Outlet • Kasir</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="badge badge-info" id="k-mode-badge">● LocalStorage</span>
      <span class="badge badge-gold" id="k-next-inv">Nota: 0001</span>
      <button type="button" class="btn btn-ghost btn-sm" onclick="openSampleReceiptModal()">🧾 Uji Struk</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="connectBluetoothPrinter()">📶 BT Struk</button>
    </div>
  </header>

  <div class="pos-grid">
    <!-- KIRI: KATALOG PRODUK -->
    <section class="panel">
      <div class="panel-head">
        <h3>🛍️ Katalog Produk</h3>
        <span class="sub-meta" id="k-prod-count">0 produk</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 150px;gap:10px;margin-bottom:14px">
        <input id="k-search" class="form-control" placeholder="Cari nama atau SKU produk..." oninput="renderProducts()">
        <select id="k-stock-only" class="form-control" onchange="renderProducts()">
          <option value="all">Semua Produk</option>
          <option value="avail">Stok Tersedia</option>
        </select>
      </div>
      <div class="prod-grid" id="k-prod-grid"></div>
    </section>

    <!-- KANAN: KERANJANG & CHECKOUT -->
    <aside class="panel">
      <div class="panel-head">
        <h3>🧾 Pesanan Aktif</h3>
        <button type="button" class="btn btn-ghost btn-sm" onclick="clearCart()">Kosongkan</button>
      </div>

      <div class="cart-items" id="k-cart-list"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group">
          <label>Channel Order</label>
          <select id="k-channel" class="form-control">
            <option value="Kasir Langsung">Kasir Langsung</option>
            <option value="Dine-In">Dine-In</option>
            <option value="Take Away">Take Away</option>
            <option value="Online">Online</option>
          </select>
        </div>
        <div class="form-group">
          <label>No. Meja (Opsional)</label>
          <input id="k-table" class="form-control" placeholder="Misal: A01">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 110px;gap:8px">
        <div class="form-group">
          <label>Atas Nama Pelanggan</label>
          <input id="k-customer" class="form-control" placeholder="Umum / Nama">
        </div>
        <div class="form-group">
          <label>Diskon (Rp)</label>
          <input type="number" id="k-discount" class="form-control" min="0" value="0" oninput="renderCartSummary()">
        </div>
      </div>

      <div class="sum-box" id="k-sum-box"></div>

      <div class="form-group">
        <label>Metode Pembayaran</label>
        <select id="k-pay-method" class="form-control" onchange="onPaymentMethodChange()"></select>
      </div>

      <div class="qris-box" id="k-qris-box">
        <div style="font-size:.78rem;font-weight:700;color:var(--gold)" id="k-qris-label">QRIS</div>
        <img id="k-qris-img" alt="QRIS">
        <div style="font-size:.72rem;color:var(--muted)" id="k-qris-note"></div>
      </div>

      <div class="form-group" id="k-cash-group">
        <label>Uang Diterima (Rp)</label>
        <input type="number" id="k-cash-paid" class="form-control" min="0" oninput="renderCartSummary()">
        <div class="quick-cash" id="k-quick-cash"></div>
      </div>

      <button type="button" class="btn btn-primary" style="width:100%;padding:12px;font-size:.9rem" onclick="checkoutOrder()">
        ✅ Proses &amp; Cetak Struk
      </button>
    </aside>
  </div>

  <!-- RIWAYAT TRANSAKSI KASIR -->
  <section class="history-panel">
    <div class="panel">
      <div class="panel-head">
        <h3>🕒 Riwayat Transaksi Terbaru</h3>
        <span class="sub-meta">Klik struk untuk cetak ulang</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No. Nota</th>
              <th>Waktu</th>
              <th>Atas Nama / Meja</th>
              <th>Channel</th>
              <th>Item</th>
              <th>Total</th>
              <th>Bayar</th>
              <th>Status</th>
              <th>Struk</th>
            </tr>
          </thead>
          <tbody id="k-trx-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>
</div>

<!-- MODAL STRUK -->
<div class="modal-bg" id="m-receipt">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap">
      <span class="sub-meta" id="k-paper-label">Kertas: 80 mm</span>
      <div style="display:flex;gap:6px">
        <button type="button" class="btn btn-ghost btn-sm" onclick="setReceiptPaperSize('58')">58 mm</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="setReceiptPaperSize('80')">80 mm</button>
      </div>
    </div>
    <div id="print-area">
      <div class="receipt-sheet paper-80" id="k-receipt-sheet"></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap">
      <button type="button" class="btn btn-info btn-sm" onclick="printBluetoothReceipt()">📶 Print Bluetooth</button>
      <button type="button" class="btn btn-gold btn-sm" onclick="window.print()">🖨️ Cetak</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="closeReceiptModal()">Tutup</button>
    </div>
  </div>
</div>

<div id="toast-box"></div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}
</script>
<script type="module">
let initializeApp,getFirestore,collection,doc,setDoc,onSnapshot,updateDoc,getDoc,writeBatch;
let FIREBASE_OK = true;
try{
  const A = await import("firebase/app");
  const F = await import("firebase/firestore");
  ({initializeApp}=A);
  ({getFirestore,collection,doc,setDoc,onSnapshot,updateDoc,getDoc,writeBatch}=F);
}catch(_){
  FIREBASE_OK = false;
  initializeApp=()=>({});getFirestore=()=>({});
  collection=()=>null;doc=()=>null;onSnapshot=()=>()=>{};
  setDoc=updateDoc=()=>Promise.reject(new Error("Offline"));
  getDoc=()=>Promise.reject(new Error("Offline"));
  writeBatch=()=>({set:()=>{},commit:()=>Promise.reject(new Error("Offline"))});
}

/* === PERBAIKAN 1: CONFIG GANTI KE PROJECT BARU (joy-pos-32251) === */
const firebaseConfig = {
  apiKey: "AIzaSyCgFbvNg0BATiaTyy1zQWQcSHmUuwEE3eM",
  authDomain: "joy-pos-32251.firebaseapp.com",
  projectId: "joy-pos-32251",
  storageBucket: "joy-pos-32251.firebasestorage.app",
  messagingSenderId: "445897636009",
  appId: "1:445897636009:web:100e02326cba0f177ad1b8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const STORAGE_MODE_KEY = 'joy_pos_storage_mode';
const LOCAL_DB_KEY = 'joy_pos_local_v1';

/* === PERBAIKAN 3: PAKSA COBA CLOUD DULU (project baru), fallback local saat error === */
let mode = FIREBASE_OK ? 'cloud' : 'local';

const DEFAULT_SEED = {
  outlets: [{ id:'OUT-1', name:'Cabang Pusat', address:'Jl. Sudirman No. 1', photo:'' }],
  employees: [
    { id:'EMP-OWNER', name:'Ade Kurnia Sandy', role:'owner', pin:'9999', outletId:'OUT-1' },
    { id:'EMP-KASIR-1', name:'Siti Kasir', role:'cashier', pin:'1234', outletId:'OUT-1' },
    { id:'EMP-KASIR-2', name:'bedul', role:'cashier', pin:'1234', outletId:'OUT-1' }
  ],
  products: [
    { id:'PRD-1', sku:'001', name:'teh manis', price:5000, costPrice:0, stock:50, photo:'' }
  ],
  transactions: [],
  paymentMethods: [],
  settings: {
    appName:'JOY POS', company:'JOY CORPORATION', tax:11,
    phone:'', npwp:'', address:'', header:'', footer:'Terima kasih',
    logoSize:'Sedang', receiptWidth:'80', appLogo:'',
    ig:'', tt:'', wa:'', web:'',
    showLogo:true, showPhone:true, showNpwp:false, showCashier:true, showSocial:true,
    invoicePrefix:'', invoiceNextNumber:1, invoiceJumpUsed:false
  }
};

let state = {
  outlets:[], employees:[], products:[], transactions:[], paymentMethods:[],
  settings:{ ...DEFAULT_SEED.settings }
};
let session = null;
let cart = [];
let lastReceiptData = null;
let btCharacteristic = null;
let activePaperSize = '80';

const rp = n => 'Rp ' + Number(n||0).toLocaleString('id-ID');

function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='err'?'err':'');
  el.textContent = msg;
  document.getElementById('toast-box').appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

function readLocal(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_DB_KEY) || '{}'); }
  catch(_){ return {}; }
}
function writeLocal(data){
  localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(data));
}

function format4DigitInvoice(num, prefix=''){
  const cleanNum = Math.max(1, Number(num)||1);
  const padded = String(cleanNum).padStart(4, '0');
  const p = String(prefix||'').trim();
  return p ? `${p}-${padded}` : padded;
}

function updateModeBadge(){
  const badge = document.getElementById('k-mode-badge');
  if(!badge) return;
  if(mode === 'local'){
    badge.textContent = '● LocalStorage';
    badge.className = 'badge badge-info';
  }else if(navigator.onLine){
    badge.textContent = '● Online Realtime';
    badge.className = 'badge badge-ok';
  }else{
    badge.textContent = '● Offline';
    badge.className = 'badge badge-ref';
  }
}

/* === PERBAIKAN 2: AUTO-SEED KE FIRESTORE SAAT KOSONG (biar bisa login besok) === */
async function seedIfEmpty(){
  const snap = await getDoc(doc(db,'settings','main'));
  if(snap.exists()) return; // sudah ada data, jangan seed ulang
  const d = DEFAULT_SEED;
  const b = writeBatch(db);
  d.outlets.forEach(o => b.set(doc(db,'outlets',o.id), o));
  d.employees.forEach(e => b.set(doc(db,'employees',e.id), e));
  d.products.forEach(p => b.set(doc(db,'products',p.id), p));
  b.set(doc(db,'settings','main'), d.settings);
  await b.commit();
  toast('Data awal berhasil dimuat ke Cloud');
}

/* === LOGIN KASIR (HANYA KASIR / BUKAN OWNER) === */
function renderLoginOptions(){
  const outSel = document.getElementById('k-login-outlet');
  const prevOut = outSel.value;
  outSel.innerHTML = state.outlets.map(o => `<option value="${o.id}">${o.name}</option>`).join('');
  if(prevOut && state.outlets.some(o=>o.id===prevOut)) outSel.value = prevOut;
  renderCashierSelect();
}

window.renderCashierSelect = () => {
  const outId = document.getElementById('k-login-outlet').value;
  const cashiers = state.employees.filter(e =>
    e.role !== 'owner' && (!outId || !e.outletId || e.outletId === outId)

/* === KATALOG & KERANJANG === */
window.renderProducts = () => {
  const q = (document.getElementById('k-search').value||'').toLowerCase();
  const onlyAvail = document.getElementById('k-stock-only').value === 'avail';
  const list = state.products.filter(p => {
    const matchQ = !q || (p.name||'').toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q);
    const stk = Number(p.stock)||0;
    const matchA = !onlyAvail || stk > 0;
    return matchQ && matchA;
  });

  document.getElementById('k-prod-count').textContent = `${list.length} produk`;
  document.getElementById('k-prod-grid').innerHTML = list.map(p => {
    const stk = Number(p.stock)||0;
    const out = stk <= 0;
    const low = stk > 0 && stk < 10;
    const stockCls = out ? 'out' : (low ? 'low' : '');
    const stockTxt = out ? 'Habis' : `Stok ${stk}`;
    return `
      <div class="prod-card ${out?'disabled':''}" onclick="${out?'':`addToCart('${p.id}')`}">
        <div>
          ${p.photo
            ? `<img src="${p.photo}" class="prod-img" alt="${p.name}">`
            : `<div class="prod-img">${(p.name||'PRD').slice(0,2).toUpperCase()}</div>`}
          <div class="prod-sku" style="margin-top:8px">${p.sku||'SKU'}</div>
          <div class="prod-name">${p.name}</div>
        </div>
        <div class="prod-foot">
          <div class="prod-price">${rp(p.price)}</div>
          <div class="prod-stock ${stockCls}">${stockTxt}</div>
        </div>
      </div>`;
  }).join('') || '<p class="sub-meta">Tidak ada produk ditemukan.</p>';
};

window.addToCart = id => {
  const prod = state.products.find(p => p.id === id);
  if(!prod) return;
  const maxStock = Number(prod.stock)||0;
  if(maxStock <= 0) return toast('Stok produk habis', 'err');

  const existing = cart.find(c => c.id === id);
  const currentQty = existing ? existing.qty : 0;
  if(currentQty + 1 > maxStock) return toast('Jumlah melebihi stok tersedia', 'err');

  if(existing) existing.qty += 1;
  else cart.push({
    id: prod.id,
    sku: prod.sku||'',
    name: prod.name,
    price: Number(prod.price)||0,
    costPrice: Number(prod.costPrice)||0,
    qty: 1
  });
  renderCart();
};

window.changeQty = (id, delta) => {
  const item = cart.find(c => c.id === id);
  const prod = state.products.find(p => p.id === id);
  if(!item) return;
  const nextQty = item.qty + delta;
  if(nextQty <= 0){
    cart = cart.filter(c => c.id !== id);
  }else{
    const maxStock = prod ? (Number(prod.stock)||0) : nextQty;
    if(nextQty > maxStock) return toast('Stok tidak mencukupi', 'err');
    item.qty = nextQty;
  }
  renderCart();
};

window.clearCart = () => {
  cart = [];
  renderCart();
};

function getOrderTotals(){
  const subtotal = cart.reduce((s,i)=> s + (i.price * i.qty), 0);
  const discount = Math.max(0, Math.min(subtotal, Number(document.getElementById('k-discount').value)||0));
  const taxable = Math.max(0, subtotal - discount);
  const taxPct = Math.max(0, Number(state.settings.tax)||0);
  const tax = Math.round(taxable * (taxPct / 100));
  const total = taxable + tax;
  return { subtotal, discount, taxPct, tax, total };
}

window.renderCartSummary = () => {
  const { subtotal, discount, taxPct, tax, total } = getOrderTotals();
  const isCash = document.getElementById('k-pay-method').value === 'CASH';
  const paidInput = document.getElementById('k-cash-paid');
  const paid = isCash ? Math.max(0, Number(paidInput.value)||0) : total;
  const change = Math.max(0, paid - total);

  document.getElementById('k-sum-box').innerHTML = `
    <div class="sum-row"><span>Subtotal</span><span>${rp(subtotal)}</span></div>
    <div class="sum-row"><span>Diskon</span><span>- ${rp(discount)}</span></div>
    <div class="sum-row"><span>Pajak (${taxPct}%)</span><span>${rp(tax)}</span></div>
    <div class="sum-row total"><span>Total Bayar</span><span>${rp(total)}</span></div>
    ${isCash ? `<div class="sum-row"><span>Kembalian</span><strong style="color:var(--accent)">${rp(change)}</strong></div>` : ''}
  `;

  const quick = [total, 10000, 20000, 50000, 100000].filter((v,i,a)=> v > 0 && a.indexOf(v)===i);
  document.getElementById('k-quick-cash').innerHTML = quick.map(v =>
    `<button type="button" class="btn btn-ghost btn-sm" onclick="setCashPaid(${v})">${rp(v)}</button>`
  ).join('');
};

function renderCart(){

function renderPaymentSelect(){

  (state.paymentMethods||[]).forEach(pm => {

/* === PROSES TRANSAKSI & NOMOR 4 DIGIT BERURUTAN === */
function consumeInvoiceNumber(){
  const s = state.settings;
  const prefix = String(s.invoicePrefix || '').trim();
  const nextNum = Math.max(1, Number(s.invoiceNextNumber) || 1);
  const invoiceId = format4DigitInvoice(nextNum, prefix);
  return { invoiceId, updatedSettings: { ...s, invoiceNextNumber: nextNum + 1, invoiceJumpUsed: true } };
}

window.checkoutOrder = async () => {
  if(!session) return toast('Sesi kasir belum aktif', 'err');
  if(!cart.length) return toast('Keranjang masih kosong', 'err');

  const { subtotal, discount, taxPct, tax, total } = getOrderTotals();
  const payVal = document.getElementById('k-pay-method').value;
  const isCash = payVal === 'CASH';
  const pm = (state.paymentMethods||[]).find(x => x.id === payVal);
  const method = isCash ? 'CASH' : (pm ? pm.type : payVal);
  const paymentDetail = isCash ? 'Tunai' : (pm ? `${pm.name}${pm.detail?' ('+pm.detail+')':''}` : payVal);

  const cashPaid = isCash ? (Number(document.getElementById('k-cash-paid').value)||0) : total;
  if(isCash && cashPaid < total) return toast('Uang diterima kurang dari total bayar', 'err');
  const change = Math.max(0, cashPaid - total);

  const { invoiceId, updatedSettings } = consumeInvoiceNumber();
  const trx = {
    id: invoiceId,
    date: new Date().toISOString(),
    outletId: session.outletId,
    outletName: session.outletName,
    employeeId: session.employeeId,
    employeeName: session.employeeName,
    customerName: document.getElementById('k-customer').value.trim() || 'Umum',
    tableNumber: document.getElementById('k-table').value.trim() || '-',
    channel: document.getElementById('k-channel').value,
    items: cart.map(i => ({ ...i })),
    subtotal,
    discount,
    taxPct,
    tax,
    total,
    cashPaid,
    change,
    method,
    paymentDetail,
    status: 'completed'
  };

  try{
    if(mode === 'local'){
      const local = readLocal();
      local.transactions = [trx, ...(local.transactions||[])];
      local.products = (local.products||[]).map(p => {
        const found = cart.find(c => c.id === p.id);
        if(!found) return p;
        return { ...p, stock: Math.max(0, (Number(p.stock)||0) - found.qty) };
      });
      local.settings = updatedSettings;
      writeLocal(local);
      loadFromLocal();
    }else{
      await setDoc(doc(db, 'transactions', trx.id), trx);
      await setDoc(doc(db, 'settings', 'main'), updatedSettings, { merge:true });
      for(const item of cart){
        const prod = state.products.find(p => p.id === item.id);
        if(prod){
          await updateDoc(doc(db, 'products', item.id), {
            stock: Math.max(0, (Number(prod.stock)||0) - item.qty)
          });
        }
      }
    }
  }catch(err){
    console.error('Gagal simpan:', err);
    // Simpan ke local dulu biar transaksi tidak hilang saat cloud error
    const local = readLocal();
    local.transactions = [trx, ...(local.transactions||[])];
    local.settings = updatedSettings;
    writeLocal(local);
    loadFromLocal();
    toast('Tersimpan offline (cloud bermasalah)', 'err');
  }

  cart = [];
  document.getElementById('k-customer').value = '';
  document.getElementById('k-table').value = '';
  document.getElementById('k-discount').value = '0';
  document.getElementById('k-cash-paid').value = '';
  renderCart();
  openReceiptModal(trx);
  toast('Transaksi ' + trx.id + ' berhasil');
};

window.connectBluetoothPrinter = async () => {
  if(!navigator.bluetooth) return toast('Browser ini belum mendukung Web Bluetooth', 'err');
  try{
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2']
    });
    const server = await device.gatt.connect();
    const services = await server.getPrimaryServices();
    for(const srv of services){
      const chars = await srv.getCharacteristics();
      const writable = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
      if(writable){ btCharacteristic = writable; break; }
    }
    toast(btCharacteristic ? 'Printer Bluetooth terhubung' : 'Perangkat terhubung (cek service cetak)', btCharacteristic ? 'ok' : 'err');
  }catch(_){
    toast('Koneksi Bluetooth dibatalkan', 'err');
  }
};

window.printBluetoothReceipt = async () => {
  if(!lastReceiptData) return;
  if(!btCharacteristic){ window.print(); return; }
  const t = lastReceiptData;
  const lineLen = activePaperSize === '58' ? 32 : 42;
  const divider = '-'.repeat(lineLen);
  const lines = [
    (state.settings.company || 'JOY CORPORATION'),
    `Nota: ${t.id} (${activePaperSize}mm)`,
    `Kasir: ${t.employeeName}`,
    divider,
    ...(t.items||[]).map(i => `${i.name} x${i.qty} = ${rp(i.price*i.qty)}`),
    divider,
    `TOTAL: ${rp(t.total)}`,
    `Bayar: ${t.paymentDetail}`,
    (state.settings.footer || 'Terima kasih'),
    '\n\n'
  ].join('\n');
  const enc = new TextEncoder().encode(lines);
  try{
    for(let i = 0; i < enc.length; i += 120){
      await btCharacteristic.writeValue(enc.slice(i, i + 120));
    }
    toast('Struk dikirim ke printer Bluetooth');
  }catch(_){
    toast('Gagal mengirim ke Bluetooth, cetak via browser', 'err');
    window.print();
  }
};

function loadFromLocal(){
  let local = readLocal();
  const hasOutlets = Array.isArray(local.outlets) && local.outlets.length > 0;
  const hasEmployees = Array.isArray(local.employees) && local.employees.length > 0;

  if(!hasOutlets || !hasEmployees){
    local = {
      ...DEFAULT_SEED,
      ...local,
      outlets: hasOutlets ? local.outlets : DEFAULT_SEED.outlets,
      employees: hasEmployees ? local.employees : DEFAULT_SEED.employees,
      products: Array.isArray(local.products) ? local.products : DEFAULT_SEED.products,
      transactions: Array.isArray(local.transactions) ? local.transactions : [],
      paymentMethods: Array.isArray(local.paymentMethods) ? local.paymentMethods : [],
      settings: { ...DEFAULT_SEED.settings, ...(local.settings||{}) }
    };
    writeLocal(local);
  }

  state.outlets = local.outlets;
  state.employees = local.employees;
  state.products = local.products;
  state.transactions = local.transactions;
  state.paymentMethods = local.paymentMethods;
  state.settings = { ...DEFAULT_SEED.settings, ...(local.settings||{}) };

  renderLoginOptions();
  renderAll();
}

    onSnapshot(collection(db,'employees'), s => { state.employees = s.docs.map(d=>({id:d.id,...d.data()})); renderLoginOptions(); renderAll(); });
    onSnapshot(collection(db,'products'), s => { state.products = s.docs.map(d=>({id:d.id,...d.data()})); renderProducts(); });
    onSnapshot(collection(db,'transactions'), s => { state.transactions = s.docs.map(d=>({id:d.id,...d.data()})); renderHistory(); });
    onSnapshot(collection(db,'paymentMethods'), s => { state.paymentMethods = s.docs.map(d=>({id:d.id,...d.data()})); renderPaymentSelect(); });
    onSnapshot(doc(db,'settings','main'), s => {
      if(s.exists()) state.settings = { ...state.settings, ...s.data() };
      renderAll();
    });
  }catch(err){
    console.warn('Cloud init gagal, fallback ke LocalStorage:', err);
    mode = 'local';
    localStorage.setItem(STORAGE_MODE_KEY, 'local');
    loadFromLocal();
  }
}
</script>
</body>
</html>
